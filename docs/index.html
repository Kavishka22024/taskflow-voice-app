<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Task App - Voice Prototype</title>
<style>
  :root { --bg:#f5f6f8; --card:#fff; --ink:#1c2430; --mute:#6b7685; --line:#dde2ea; --accent:#1f6feb; --bad:#c62828; --ok:#2e7d32; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#12161c; --card:#1b212a; --ink:#e8ecf2; --mute:#98a3b3; --line:#2c3541; --accent:#4c8dff; --bad:#ef5350; --ok:#66bb6a; }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; }
  main { max-width:760px; margin:0 auto; padding:16px; }
  h1 { font-size:1.25rem; margin:0 0 4px; }
  h2 { font-size:1rem; margin:0 0 10px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px; margin-top:14px; }
  label { display:block; font-size:.85rem; color:var(--mute); margin:8px 0 4px; }
  input[type=text], input[type=password], select, textarea { width:100%; padding:10px; border:1px solid var(--line); border-radius:8px; background:var(--bg); color:var(--ink); font:inherit; }
  button { padding:10px 16px; border:0; border-radius:8px; background:var(--accent); color:#fff; font:inherit; cursor:pointer; min-height:44px; }
  button.secondary { background:transparent; color:var(--accent); border:1px solid var(--accent); }
  button.rec { background:var(--bad); }
  button:disabled { opacity:.5; cursor:not-allowed; }
  .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .row > * { flex:0 0 auto; }
  .grow { flex:1 1 200px !important; }
  .status { font-size:.9rem; color:var(--mute); margin-top:8px; }
  .ok { color:var(--ok); } .bad { color:var(--bad); }
  .msg { border:1px solid var(--line); border-radius:10px; padding:10px; margin-top:8px; }
  .msg .who { font-size:.8rem; color:var(--mute); }
  .msg .tr { margin:6px 0 0; white-space:pre-wrap; }
  .msg .en { margin:4px 0 0; font-size:.9rem; color:var(--mute); white-space:pre-wrap; }
  audio { width:100%; margin-top:6px; }
  ul { margin:4px 0 0 18px; padding:0; }
  pre { white-space:pre-wrap; font-size:.8rem; color:var(--mute); }
</style>
</head>
<body>
<main>
  <h1>Task App - Voice &amp; AI Prototype</h1>
  <div class="status">Purpose: check (1) does the microphone work on this device, (2) is Sinhala understood, (3) is the task summary useful.</div>

  <section class="card">
    <h2>1. Connection</h2>
    <label for="url">Apps Script web app URL (ends with /exec)</label>
    <input id="url" type="text" placeholder="https://script.google.com/macros/s/.../exec">
    <label for="pass">Prototype passcode</label>
    <input id="pass" type="password" placeholder="the PROTO_PASSCODE you set">
    <div class="row" style="margin-top:10px">
      <button id="save" class="secondary">Save</button>
      <button id="ping" class="secondary">Test connection</button>
    </div>
    <div id="connStatus" class="status"></div>
  </section>

  <section class="card">
    <h2>2. Add a message to the test task</h2>
    <div class="row">
      <div class="grow"><label for="sender">Sending as</label>
        <select id="sender"><option>Manager</option><option>Worker</option></select></div>
    </div>
    <div class="row" style="margin-top:10px">
      <button id="recBtn">Start recording</button>
      <span id="timer" class="status">0:00 (max 2:00)</span>
    </div>
    <div class="row" style="margin-top:10px">
      <label class="status" for="fileIn" style="margin:0">Or pick / record an audio file:</label>
      <input id="fileIn" type="file" accept="audio/*" capture>
    </div>
    <div id="micStatus" class="status"></div>

    <label for="txt" style="margin-top:14px">Or type a message</label>
    <div class="row">
      <input id="txt" class="grow" type="text" placeholder="Type an update...">
      <button id="sendTxt" class="secondary">Add</button>
    </div>
  </section>

  <section class="card">
    <h2>3. Conversation</h2>
    <div id="thread"><div class="status">No messages yet.</div></div>
    <div class="row" style="margin-top:12px">
      <button id="sumBtn">Summarize task</button>
      <button id="clearBtn" class="secondary">Clear conversation</button>
    </div>
    <div id="sumOut" style="margin-top:10px"></div>
  </section>

  <section class="card">
    <h2>Log</h2>
    <pre id="log"></pre>
  </section>
</main>

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var MAX_SECONDS = 120;
  var messages = [];
  var recorder = null, stream = null, chunks = [], tick = null, startedAt = 0;

  function log(s) { $('log').textContent = new Date().toLocaleTimeString() + '  ' + s + '\n' + $('log').textContent; }
  function store(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  function load(k) { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } }

  $('url').value = load('proto_url');
  $('pass').value = load('proto_pass');
  $('save').onclick = function () { store('proto_url', $('url').value.trim()); store('proto_pass', $('pass').value); $('connStatus').textContent = 'Saved.'; };

  async function api(action, extra) {
    var url = $('url').value.trim();
    if (!url) throw new Error('Enter the Apps Script URL first');
    var res = await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // avoids CORS preflight
      body: JSON.stringify(Object.assign({ action: action, passcode: $('pass').value }, extra || {}))
    });
    var json = await res.json();
    if (!json.ok) throw new Error(json.error || 'Unknown server error');
    return json.data;
  }

  $('ping').onclick = async function () {
    $('connStatus').textContent = 'Testing...';
    try {
      var res = await fetch($('url').value.trim());
      var j = await res.json();
      $('connStatus').innerHTML = '<span class="ok">Connected: ' + (j.message || 'ok') + '</span>';
    } catch (e) { $('connStatus').innerHTML = '<span class="bad">Failed: ' + e.message + '</span>'; }
  };

  /* ---------- audio helpers ---------- */
  function pickMime() {
    var c = ['audio/webm;codecs=opus', 'audio/mp4', 'audio/webm', 'audio/ogg;codecs=opus'];
    if (!window.MediaRecorder) return '';
    for (var i = 0; i < c.length; i++) { if (MediaRecorder.isTypeSupported(c[i])) return c[i]; }
    return '';
  }

  // Convert any recorded/picked audio to 16 kHz mono WAV (a format Gemini accepts on every device).
  async function toWav(blob) {
    var buf = await blob.arrayBuffer();
    var Ctx = window.AudioContext || window.webkitAudioContext;
    var ctx = new Ctx();
    var decoded = await new Promise(function (res, rej) { ctx.decodeAudioData(buf, res, rej); });
    ctx.close();
    var off = new OfflineAudioContext(1, Math.ceil(decoded.duration * 16000), 16000);
    var src = off.createBufferSource();
    src.buffer = decoded; src.connect(off.destination); src.start();
    var rendered = await off.startRendering();
    return encodeWav(rendered.getChannelData(0), 16000);
  }
  function encodeWav(samples, rate) {
    var ab = new ArrayBuffer(44 + samples.length * 2), v = new DataView(ab);
    function w(o, s) { for (var i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); }
    w(0, 'RIFF'); v.setUint32(4, 36 + samples.length * 2, true); w(8, 'WAVE'); w(12, 'fmt ');
    v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
    v.setUint32(24, rate, true); v.setUint32(28, rate * 2, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true);
    w(36, 'data'); v.setUint32(40, samples.length * 2, true);
    for (var i = 0, o = 44; i < samples.length; i++, o += 2) {
      var s = Math.max(-1, Math.min(1, samples[i]));
      v.setInt16(o, s < 0 ? s * 0x8000 : s * 0x7fff, true);
    }
    return new Blob([ab], { type: 'audio/wav' });
  }
  function toBase64(blob) {
    return new Promise(function (res, rej) {
      var r = new FileReader();
      r.onload = function () { res(String(r.result).split(',')[1]); };
      r.onerror = rej; r.readAsDataURL(blob);
    });
  }

  /* ---------- recording ---------- */
  $('recBtn').onclick = async function () {
    if (recorder && recorder.state === 'recording') { recorder.stop(); return; }
    try {
      stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    } catch (e) {
      $('micStatus').innerHTML = '<span class="bad">Microphone blocked or unavailable: ' + e.name + '. Try the audio file option below.</span>';
      log('getUserMedia failed: ' + e.name + ' ' + e.message);
      return;
    }
    $('micStatus').innerHTML = '<span class="ok">Microphone works on this device/browser.</span>';
    var mime = pickMime();
    recorder = mime ? new MediaRecorder(stream, { mimeType: mime }) : new MediaRecorder(stream);
    chunks = [];
    recorder.ondataavailable = function (e) { if (e.data.size) chunks.push(e.data); };
    recorder.onstop = async function () {
      clearInterval(tick);
      stream.getTracks().forEach(function (t) { t.stop(); });
      $('recBtn').textContent = 'Start recording'; $('recBtn').classList.remove('rec');
      var blob = new Blob(chunks, { type: recorder.mimeType || mime || 'audio/webm' });
      log('Recorded ' + Math.round(blob.size / 1024) + ' KB as ' + blob.type);
      await handleAudio(blob);
    };
    recorder.start();
    startedAt = Date.now();
    $('recBtn').textContent = 'Stop recording'; $('recBtn').classList.add('rec');
    tick = setInterval(function () {
      var s = Math.floor((Date.now() - startedAt) / 1000);
      $('timer').textContent = Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0') + ' (max 2:00)';
      if (s >= MAX_SECONDS) recorder.stop();
    }, 250);
  };

  $('fileIn').onchange = async function () {
    var f = this.files[0]; this.value = '';
    if (f) { log('Picked file ' + f.name + ' (' + Math.round(f.size / 1024) + ' KB, ' + f.type + ')'); await handleAudio(f); }
  };

  async function handleAudio(blob) {
    var sender = $('sender').value;
    var m = { sender: sender, type: 'voice', text: 'Transcribing...', time: new Date().toLocaleTimeString(), audioUrl: URL.createObjectURL(blob), en: '' };
    messages.push(m); render();
    try {
      var wav = await toWav(blob);
      var data = await api('transcribe', { audioBase64: await toBase64(wav), mimeType: 'audio/wav' });
      m.text = data.transcript || '(empty)'; m.en = data.english_translation || '';
      m.lang = data.language || '';
      log('Transcribed (' + m.lang + ')');
    } catch (e) {
      m.text = '[Transcription failed: ' + e.message + ']'; m.failed = true;
      log('Transcribe error: ' + e.message);
    }
    render();
  }

  $('sendTxt').onclick = function () {
    var t = $('txt').value.trim(); if (!t) return;
    messages.push({ sender: $('sender').value, type: 'text', text: t, time: new Date().toLocaleTimeString() });
    $('txt').value = ''; render();
  };

  /* ---------- thread + summary ---------- */
  function render() {
    var box = $('thread'); box.textContent = '';
    if (!messages.length) { box.innerHTML = '<div class="status">No messages yet.</div>'; return; }
    messages.forEach(function (m) {
      var d = document.createElement('div'); d.className = 'msg';
      var who = document.createElement('div'); who.className = 'who';
      who.textContent = m.sender + ' - ' + m.type + ' - ' + m.time + (m.lang ? ' - ' + m.lang : '');
      var tr = document.createElement('div'); tr.className = 'tr'; tr.textContent = m.text;
      d.appendChild(who); d.appendChild(tr);
      if (m.en) { var en = document.createElement('div'); en.className = 'en'; en.textContent = 'English: ' + m.en; d.appendChild(en); }
      if (m.audioUrl) { var a = document.createElement('audio'); a.controls = true; a.src = m.audioUrl; d.appendChild(a); }
      box.appendChild(d);
    });
  }

  function addList(parent, title, items) {
    var h = document.createElement('div'); h.className = 'who'; h.textContent = title; parent.appendChild(h);
    var ul = document.createElement('ul');
    (items && items.length ? items : ['Not mentioned']).forEach(function (x) { var li = document.createElement('li'); li.textContent = x; ul.appendChild(li); });
    parent.appendChild(ul);
  }

  $('sumBtn').onclick = async function () {
    var usable = messages.filter(function (m) { return !m.failed && m.text !== 'Transcribing...'; });
    if (!usable.length) { $('sumOut').textContent = 'Add at least one message first.'; return; }
    $('sumOut').textContent = 'Summarizing...';
    try {
      var s = await api('summarize', { messages: usable.map(function (m) { return { sender: m.sender, type: m.type, text: m.text, time: m.time }; }) });
      var out = $('sumOut'); out.textContent = '';
      var card = document.createElement('div'); card.className = 'msg';
      [['Summary (English)', s.summary_en], ['Summary (Sinhala)', s.summary_si], ['Progress so far', s.progress_note]].forEach(function (p) {
        var h = document.createElement('div'); h.className = 'who'; h.textContent = p[0];
        var t = document.createElement('div'); t.className = 'tr'; t.textContent = p[1] || 'Not mentioned';
        card.appendChild(h); card.appendChild(t);
      });
      addList(card, 'Blockers', s.blockers); addList(card, 'Next steps', s.next_steps);
      out.appendChild(card);
    } catch (e) { $('sumOut').innerHTML = ''; $('sumOut').textContent = 'Summary failed: ' + e.message; log('Summarize error: ' + e.message); }
  };

  $('clearBtn').onclick = function () { messages = []; $('sumOut').textContent = ''; render(); };

  // report what this browser supports as soon as the page opens
  $('micStatus').textContent = (navigator.mediaDevices && window.MediaRecorder)
    ? 'Recording is supported here. Press Start recording to test the microphone.'
    : 'This browser cannot record in-page. Use the audio file option.';
  log('Page loaded. Secure context: ' + window.isSecureContext + '. Recorder format: ' + (pickMime() || 'default'));
})();
</script>
</body>
</html>
